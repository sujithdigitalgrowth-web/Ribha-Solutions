<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary SEO -->
    <title>Ribha Solutions - Hire Skilled Freelancers | Freelance Marketplace India</title>
    <meta name="description" content="Hire verified freelancers for web development, design, marketing, writing, AI, and more. Post jobs free. Secure milestone payments. 18,000+ skilled freelancers on India's trusted freelance marketplace." />
    <meta name="keywords" content="freelance marketplace, hire freelancers, freelancing jobs, web development freelancers, design freelancers, marketing freelancers, India freelance platform, remote work, post a job, find freelancers" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ribhasolutions.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ribha Solutions" />
    <meta property="og:title" content="Ribha Solutions - Hire Skilled Freelancers | Freelance Marketplace India" />
    <meta property="og:description" content="Hire verified freelancers for web development, design, marketing, writing, AI, and more. Post jobs free. 18,000+ skilled freelancers on India's trusted freelance marketplace." />
    <meta property="og:url" content="https://ribhasolutions.com/" />
    <meta property="og:image" content="https://ribhasolutions.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ribha Solutions - Hire Skilled Freelancers" />
    <meta name="twitter:description" content="India's trusted freelance marketplace. Post jobs free. Connect with 18,000+ verified freelancers." />
    <meta name="twitter:image" content="https://ribhasolutions.com/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Ribha Solutions",
      "url": "https://ribhasolutions.com",
      "logo": "https://ribhasolutions.com/favicon.svg",
      "description": "India's trusted freelance marketplace connecting clients with verified freelancers across web development, design, marketing, writing, and more.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://ribhasolutions.com/contact-support"
      }
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ribha Solutions",
      "url": "https://ribhasolutions.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://ribhasolutions.com/find-talent?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;background:#fff">
    <div id="root" style="min-height:100vh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
